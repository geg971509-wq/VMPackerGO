name: Planner budget one-shot

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/planner-budget-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Integrate planner resource budget
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('internal/elf/rewrite_plan.go'); s=p.read_text(); old='func (planner *rewritePlanner) validate() error {\n'; new='func (planner *rewritePlanner) validate() error {\n\tif err := validateRewriteBudget(uint64(len(planner.req.Input)), planner.plan.segments); err != nil {\n\t\treturn err\n\t}\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          gofmt -w internal/elf/rewrite_plan.go internal/elf/rewrite_budget.go internal/elf/rewrite_budget_test.go
          go test -count=1 -run '^TestValidateRewriteBudget' ./internal/elf
          git diff --check
      - name: Commit planner budget
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/elf/rewrite_plan.go internal/elf/rewrite_budget.go internal/elf/rewrite_budget_test.go
          git commit -m 'Bound aggregate rewrite expansion and output size'
          git push origin HEAD:codex/productization-closure-20260903
