name: Phase 13 Exception Preflight Apply

on:
  push:
    branches:
      - fix/exception-bridge-preflight

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase13_exception_preflight_patch.py
          gofmt -w \
            internal/arch/arm64/translator.go \
            internal/arch/arm64/source_map_test.go \
            internal/elf/preparation.go \
            internal/elf/exception_preflight.go \
            internal/elf/exception_preflight_test.go \
            internal/app/run.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          go test -count=1 ./internal/arch/arm64 ./internal/unwind ./internal/elf ./internal/app
          go vet ./internal/arch/arm64 ./internal/unwind ./internal/elf ./internal/app
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm scripts/phase13_exception_preflight_patch.py .github/workflows/phase13-exception-preflight-apply.yml
          git add internal/arch/arm64 internal/elf internal/app
          git config user.name "vmpacker-phase13-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Integrate fail-closed C++ exception preflight"
          git push origin HEAD:fix/exception-bridge-preflight
