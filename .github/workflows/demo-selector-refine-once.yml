name: Demo selector refine one-shot

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/demo-selector-refine-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Remove fallback main where explicit targets exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('demo/device-cases.json')
          data = json.loads(path.read_text())
          for entry in data['entries']:
              if entry['language'] != 'c':
                  continue
              selectors = entry['selectors']
              non_main = [selector for selector in selectors if selector['name'] != 'main']
              if non_main:
                  entry['selectors'] = non_main
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit refined selectors
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add demo/device-cases.json
          git diff --cached --check
          git commit -m 'Refine demo selectors to explicit protected targets'
          git push origin HEAD:codex/productization-closure-20260903
