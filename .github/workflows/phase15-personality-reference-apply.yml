name: Phase 15 Personality Reference Apply

on:
  push:
    branches:
      - fix/exception-personality-reference

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase15_personality_reference_patch.py
          gofmt -w \
            internal/unwind/frame.go \
            internal/unwind/bridge.go \
            internal/unwind/unwind_test.go \
            internal/elf/exception_preflight_test.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME
          go test -count=1 ./internal/unwind ./internal/elf
          go vet ./internal/unwind ./internal/elf
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm scripts/phase15_personality_reference_patch.py .github/workflows/phase15-personality-reference-apply.yml
          git add internal/unwind internal/elf
          git config user.name "vmpacker-phase15-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Preserve relocatable indirect personality references"
          git push origin HEAD:fix/exception-personality-reference
