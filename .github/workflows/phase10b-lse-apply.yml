name: Phase 10b LSE Apply

on:
  push:
    branches:
      - fix/lse-minmax-family

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase10b_lse_patch.py
          gofmt -w \
            internal/arch/arm64/decoder.go \
            internal/arch/arm64/decode_lse_atomic.go \
            internal/arch/arm64/policy.go \
            internal/arch/arm64/translator.go \
            internal/arch/arm64/tr_atomic.go \
            internal/arch/arm64/lse_atomic_test.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          go test -count=1 ./internal/arch/arm64 ./internal/vm
          go vet ./internal/arch/arm64 ./internal/vm
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm scripts/phase10b_lse_patch.py .github/workflows/phase10b-lse-apply.yml
          git add internal/arch/arm64 internal/runtime/templates/android/arm64
          git config user.name "vmpacker-phase10b-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete scalar LSE minmax RMW family"
          git push origin HEAD:fix/lse-minmax-family
