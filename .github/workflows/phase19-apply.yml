name: Phase19 branchful exclusive implementation

on:
  push:
    branches:
      - fix/phase19-branchful-exclusive
    paths:
      - .github/workflows/phase19-apply.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/phase19-branchful-exclusive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Apply audited CFG closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase19_apply.py
          gofmt -w internal/arch/arm64/tr_exclusive.go internal/arch/arm64/compiler_corpus_test.go internal/arch/arm64/exclusive_cfg_test.go internal/runtime/exclusivegen.go internal/runtime/exclusive_cfg_test.go internal/vm/types.go
          go test -count=1 ./internal/arch/arm64 ./internal/runtime
          go test -count=1 ./...
          go vet ./...
      - name: Commit product-only implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vmpacker-phase19-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/phase19-apply.yml .github/workflows/phase19-exclusive-audit.yml scripts/phase19_apply.py
          git add internal/arch/arm64/tr_exclusive.go internal/arch/arm64/compiler_corpus_test.go internal/arch/arm64/exclusive_cfg_test.go internal/runtime/exclusivegen.go internal/runtime/exclusive_cfg_test.go internal/vm/types.go
          git diff --cached --check
          git commit -m 'Close branchful exclusive CFGs in native thunks'
          git push origin HEAD:fix/phase19-branchful-exclusive