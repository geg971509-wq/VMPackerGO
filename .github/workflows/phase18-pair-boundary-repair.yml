name: Phase18 pair boundary repair

on:
  push:
    branches:
      - fix/compiler-r29-coverage-v2
    paths:
      - .github/workflows/phase18-pair-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/compiler-r29-coverage-v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply precise pair-boundary repairs
        run: |
          set -euo pipefail
          python3 scripts/phase18_pair_boundary_repair.py
          gofmt -w internal/arch/arm64/decode_ldst.go internal/arch/arm64/policy.go internal/arch/arm64/compiler_gap_regression_test.go
          go test -count=1 ./internal/arch/arm64
          go vet ./internal/arch/arm64
      - name: Commit product-only result
        run: |
          set -euo pipefail
          git config user.name 'vmpacker-phase18-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/phase18-pair-boundary-repair.yml scripts/phase18_pair_boundary_repair.py
          git add internal/arch/arm64/decode_ldst.go internal/arch/arm64/policy.go internal/arch/arm64/compiler_gap_regression_test.go
          git diff --cached --check
          git commit -m 'Tighten pair decode and addressing boundaries'
          git push origin HEAD:fix/compiler-r29-coverage-v2
