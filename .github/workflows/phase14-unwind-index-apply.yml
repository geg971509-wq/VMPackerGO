name: Phase 14 Runtime Unwind Index Apply

on:
  push:
    branches:
      - fix/runtime-unwind-index

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase14_unwind_index_patch.py
          gofmt -w \
            internal/unwind/header.go \
            internal/unwind/unwind_test.go \
            internal/elf/rewrite_plan.go \
            internal/elf/rewrite_plan_test.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME
          go test -count=1 ./internal/unwind ./internal/elf
          go vet ./internal/unwind ./internal/elf
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm scripts/phase14_unwind_index_patch.py .github/workflows/phase14-unwind-index-apply.yml
          git add internal/unwind internal/elf
          git config user.name "vmpacker-phase14-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Integrate runtime FDEs into GNU unwind index"
          git push origin HEAD:fix/runtime-unwind-index
