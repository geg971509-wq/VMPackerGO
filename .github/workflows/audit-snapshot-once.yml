name: Audit source snapshot one-shot

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/audit-snapshot-once.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Archive exact checkout
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=dist -czf "$RUNNER_TEMP/VMPackerGO-audit.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: vmpackergo-audit-source
          path: ${{ runner.temp }}/VMPackerGO-audit.tgz
          if-no-files-found: error
          retention-days: 1
