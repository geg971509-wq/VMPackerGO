name: Productization one-shot patch

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/productization-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Add validated native external tail-call lowering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          replace_exact(
              "internal/arch/arm64/translator.go",
              '''\tnativeCallSites     []NativeCallSite
          \toutlinedTailInlines map[int][]uint32
          \tentryBTI            Op
          ''',
              '''\tnativeCallSites     []NativeCallSite
          \toutlinedTailInlines map[int][]uint32
          \tnativeTailTransfers map[int]struct{}
          \tentryBTI            Op
          ''',
          )
          replace_exact(
              "internal/arch/arm64/translator.go",
              '''\t\tfpSIMDInstructions:  make(map[uint32]bool),
          \t\toutlinedTailInlines: make(map[int][]uint32),
          \t}, nil
          ''',
              '''\t\tfpSIMDInstructions:  make(map[uint32]bool),
          \t\toutlinedTailInlines: make(map[int][]uint32),
          \t\tnativeTailTransfers: make(map[int]struct{}),
          \t}, nil
          ''',
          )

          path = Path("internal/arch/arm64/tr_branch.go")
          text = path.read_text()
          text = text.replace(
              '''\tif _, exists := t.outlinedTailInlines[branchOffset]; exists {
          \t\treturn fmt.Errorf("tail branch offset 0x%x is configured more than once", branchOffset)
          \t}
          ''',
              '''\tif _, exists := t.outlinedTailInlines[branchOffset]; exists {
          \t\treturn fmt.Errorf("tail branch offset 0x%x is configured more than once", branchOffset)
          \t}
          \tif _, exists := t.nativeTailTransfers[branchOffset]; exists {
          \t\treturn fmt.Errorf("tail branch offset 0x%x is configured more than once", branchOffset)
          \t}
          ''',
          )
          insertion = '''
          // SetNativeTailTransfer marks a terminal direct B to an executable target
          // outside the selected set. It is deliberately lowered to CALL_IMAGE + RET
          // instead of branching out of the interpreter: this preserves cleanup,
          // AAPCS64 bridge validation, and exception/unwind routing.
          func (t *Translator) SetNativeTailTransfer(branchOffset int) error {
          \tif branchOffset < 0 || branchOffset%4 != 0 || branchOffset+4 != t.funcSize {
          \t\treturn fmt.Errorf("native tail branch offset 0x%x is not the final instruction of a 0x%x-byte function", branchOffset, t.funcSize)
          \t}
          \tif _, exists := t.outlinedTailInlines[branchOffset]; exists {
          \t\treturn fmt.Errorf("tail branch offset 0x%x is configured more than once", branchOffset)
          \t}
          \tif _, exists := t.nativeTailTransfers[branchOffset]; exists {
          \t\treturn fmt.Errorf("tail branch offset 0x%x is configured more than once", branchOffset)
          \t}
          \tt.nativeTailTransfers[branchOffset] = struct{}{}
          \treturn nil
          }

          '''
          marker = 'func (t *Translator) trBranchOrOutlined(inst vm.Instruction) error {'
          if text.count(marker) != 1:
              raise SystemExit("tr_branch.go: trBranchOrOutlined marker changed")
          text = text.replace(marker, insertion + marker, 1)
          old = '''func (t *Translator) trBranchOrOutlined(inst vm.Instruction) error {
          \traws, configured := t.outlinedTailInlines[inst.Offset]
          '''
          new = '''func (t *Translator) trBranchOrOutlined(inst vm.Instruction) error {
          \tif _, configured := t.nativeTailTransfers[inst.Offset]; configured {
          \t\ttarget := int64(inst.Offset) + inst.Imm
          \t\tif target >= 0 && target < int64(t.funcSize) {
          \t\t\treturn fmt.Errorf("native tail handling at 0x%x is configured for an in-function branch target 0x%x", inst.Offset, target)
          \t\t}
          \t\treturn t.trNativeTail(inst)
          \t}
          \traws, configured := t.outlinedTailInlines[inst.Offset]
          '''
          if text.count(old) != 1:
              raise SystemExit("tr_branch.go: dispatch block changed")
          text = text.replace(old, new, 1)
          marker = 'func (t *Translator) trBranch(inst vm.Instruction) error {'
          native_impl = '''// trNativeTail de-optimizes an external A64 tail branch to a validated
          // native call followed by the protected function return. The call site is
          // recorded explicitly because the source instruction is B rather than BL.
          func (t *Translator) trNativeTail(inst vm.Instruction) error {
          \tpc, err := addAddressDelta(t.funcAddr, int64(inst.Offset))
          \tif err != nil {
          \t\treturn err
          \t}
          \ttarget, err := addAddressDelta(pc, inst.Imm)
          \tif err != nil {
          \t\treturn err
          \t}
          \tvmOffset := t.pos()
          \tt.emitImageReference(vm.OpCallImage, nil, target)
          \tt.nativeCallSites = append(t.nativeCallSites, NativeCallSite{
          \t\tARM64Offset: inst.Offset,
          \t\tVMOffset:    vmOffset,
          \t})
          \tt.emitOp(vm.OpRet, 0)
          \treturn nil
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("tr_branch.go: trBranch marker changed")
          path.write_text(text.replace(marker, native_impl + marker, 1))

          path = Path("internal/elf/outliner.go")
          text = path.read_text()
          old = '''\t\tnames, err := symbols.directTransferNames(branchSite, target)
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\thelper, matched, err := resolveOutlinedTailHelper(input, meta, symbols, selection, branchSite, target, names)
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\tif !matched {
          \t\t\treturn fmt.Errorf("external unconditional branch at 0x%X to 0x%X is neither a selected packed tail target nor a validated compiler outlined helper", branchSite, target)
          \t\t}
          \t\tif err := translator.SetOutlinedTailInline(inst.Offset, helper.raws); err != nil {
          \t\t\treturn fmt.Errorf("outlined helper %q: %w", helper.name, err)
          \t\t}
          '''
          new = '''\t\tvar names []string
          \t\tif symbols != nil {
          \t\t\tvar err error
          \t\t\tnames, err = symbols.directTransferNames(branchSite, target)
          \t\t\tif err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t\thelper, matched, err := resolveOutlinedTailHelper(input, meta, symbols, selection, branchSite, target, names)
          \t\t\tif err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t\tif matched {
          \t\t\t\tif err := translator.SetOutlinedTailInline(inst.Offset, helper.raws); err != nil {
          \t\t\t\t\treturn fmt.Errorf("outlined helper %q: %w", helper.name, err)
          \t\t\t\t}
          \t\t\t\tcontinue
          \t\t\t}
          \t\t}

          \t\ttargetEnd, ok := checkedAdd(target, 4)
          \t\tif !ok || target%4 != 0 || meta == nil {
          \t\t\treturn fmt.Errorf("external unconditional branch at 0x%X to 0x%X has no validated executable target", branchSite, target)
          \t\t}
          \t\tif _, ok := meta.executableMapping(target, targetEnd); !ok {
          \t\t\treturn fmt.Errorf("external unconditional branch at 0x%X to 0x%X is not file-backed by one executable PT_LOAD", branchSite, target)
          \t\t}
          \t\tif err := translator.SetNativeTailTransfer(inst.Offset); err != nil {
          \t\t\treturn fmt.Errorf("native tail target 0x%X: %w", target, err)
          \t\t}
          '''
          if text.count(old) != 1:
              raise SystemExit("outliner.go: external tail fallback block changed")
          path.write_text(text.replace(old, new, 1))

          path = Path("internal/elf/packed_tail_test.go")
          text = path.read_text()
          text = text.replace('import (\n\t"testing"', 'import (\n\t"debug/elf"\n\t"testing"', 1)
          old = '''func TestUnselectedExternalTailRemainsFailClosed(t *testing.T) {
          \topcodes := vm.IdentityOpcodeMap()
          \ttranslator, err := arm64.NewTranslator(0x1000, 4, opcodes)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tselection := Selection{Name: "caller", Address: 0x1000, End: 0x1004}
          \tinstructions := []vm.Instruction{{Op: int(arm64.B), Offset: 0, Imm: 0x1000}}
          \terr = configureExternalTailTransfers(nil, nil, &symbolIndex{}, selection, instructions, translator, nil)
          \tif err == nil {
          \t\tt.Fatal("unselected external tail unexpectedly passed preparation")
          \t}
          }
          '''
          new = '''func TestExecutableUnselectedExternalTailBecomesNativeCallReturn(t *testing.T) {
          \topcodes := vm.IdentityOpcodeMap()
          \ttranslator, err := arm64.NewTranslator(0x1000, 4, opcodes)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tselection := Selection{Name: "caller", Address: 0x1000, End: 0x1004}
          \tinstructions := []vm.Instruction{{Op: int(arm64.B), Offset: 0, Imm: 0x1000}}
          \tmeta := &elfMetadata{loads: []loadMapping{{
          \t\tvaddr: 0x2000, filesz: 0x100, memsz: 0x100,
          \t\tflags: elf.PF_R | elf.PF_X,
          \t}}}
          \tif err := configureExternalTailTransfers(nil, meta, nil, selection, instructions, translator, nil); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tresult, err := translator.Translate(instructions)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif len(result.Unsupported) != 0 {
          \t\tt.Fatalf("native tail was rejected: %v", result.Unsupported)
          \t}
          \tif len(result.Relocations) != 1 || result.Relocations[0].TargetVA != 0x2000 {
          \t\tt.Fatalf("native tail relocation=%+v", result.Relocations)
          \t}
          \tif len(result.NativeCallSites) != 1 || result.NativeCallSites[0].ARM64Offset != 0 || result.NativeCallSites[0].VMOffset != 0 {
          \t\tt.Fatalf("native tail call sites=%+v", result.NativeCallSites)
          \t}
          \tcallImage, _ := opcodes.Wire(vm.OpCallImage)
          \tret, _ := opcodes.Wire(vm.OpRet)
          \tif len(result.Bytecode) < 11 || result.Bytecode[0] != callImage || result.Bytecode[9] != ret || result.Bytecode[10] != 0 {
          \t\tt.Fatalf("native tail bytecode prefix=%x", result.Bytecode)
          \t}
          }

          func TestUnmappedExternalTailRemainsFailClosed(t *testing.T) {
          \topcodes := vm.IdentityOpcodeMap()
          \ttranslator, err := arm64.NewTranslator(0x1000, 4, opcodes)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tselection := Selection{Name: "caller", Address: 0x1000, End: 0x1004}
          \tinstructions := []vm.Instruction{{Op: int(arm64.B), Offset: 0, Imm: 0x1000}}
          \terr = configureExternalTailTransfers(nil, &elfMetadata{}, nil, selection, instructions, translator, nil)
          \tif err == nil {
          \t\tt.Fatal("unmapped external tail unexpectedly passed preparation")
          \t}
          }

          func TestNonTerminalNativeExternalTailRemainsFailClosed(t *testing.T) {
          \topcodes := vm.IdentityOpcodeMap()
          \ttranslator, err := arm64.NewTranslator(0x1000, 8, opcodes)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tselection := Selection{Name: "caller", Address: 0x1000, End: 0x1008}
          \tinstructions := []vm.Instruction{
          \t\t{Op: int(arm64.B), Offset: 0, Imm: 0x1000},
          \t\t{Op: int(arm64.NOP), Offset: 4},
          \t}
          \tmeta := &elfMetadata{loads: []loadMapping{{
          \t\tvaddr: 0x2000, filesz: 0x100, memsz: 0x100,
          \t\tflags: elf.PF_R | elf.PF_X,
          \t}}}
          \terr = configureExternalTailTransfers(nil, meta, nil, selection, instructions, translator, nil)
          \tif err == nil {
          \t\tt.Fatal("non-terminal native external branch unexpectedly passed preparation")
          \t}
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("packed_tail_test.go: old fail-closed test changed")
          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/arch/arm64/translator.go internal/arch/arm64/tr_branch.go internal/elf/outliner.go internal/elf/packed_tail_test.go
          go test -count=1 ./internal/arch/arm64
          go test -count=1 -run 'TestSelectedExternalTailBecomesPackedTail|TestExecutableUnselectedExternalTailBecomesNativeCallReturn|TestUnmappedExternalTailRemainsFailClosed|TestNonTerminalNativeExternalTailRemainsFailClosed' ./internal/elf
      - name: Commit native tail-call closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/arch/arm64/translator.go internal/arch/arm64/tr_branch.go internal/elf/outliner.go internal/elf/packed_tail_test.go
          git commit -m "Lower validated native external tail calls"
          git push origin HEAD:codex/productization-closure-20260903
