name: Productization one-shot patch

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/productization-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Repair stale exception-invoke test call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/runtime/runtime_test.go")
          text = path.read_text()
          old = "\tassembly, got, err := generateExceptionInvokeThunks([]ExceptionInvokeConfig{cfg})"
          new = "\t_, assembly, got, err := generateExceptionInvokeThunks([]ExceptionInvokeConfig{cfg})"
          if old not in text:
              raise SystemExit("expected stale three-result call was not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repaired test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/runtime/runtime_test.go
          git commit -m "Repair exception invoke generator test"
          git push origin HEAD:codex/productization-closure-20260903
