name: Productization one-shot patch

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/productization-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Repair exception invoke route semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              if count is not None and actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new))

          path = Path("internal/runtime/runtime_test.go")
          text = path.read_text()
          text = text.replace(
              "\tassembly, got, err := generateExceptionInvokeThunks(",
              "\t_, assembly, got, err := generateExceptionInvokeThunks(",
          )
          text = text.replace(
              "\tif _, _, err := generateExceptionInvokeThunks(",
              "\tif _, _, _, err := generateExceptionInvokeThunks(",
          )
          if "generateExceptionInvokeThunks" in text:
              for line in text.splitlines():
                  if "generateExceptionInvokeThunks" in line and line.count(",") < 3:
                      raise SystemExit(f"runtime_test.go still has a stale result assignment: {line}")
          path.write_text(text)

          replace_exact(
              "internal/runtime/invokegen.go",
              "static inline int vm_try_exception_invoke(vm_ctx_t *vm, u64 target) {",
              "static inline int vm_try_exception_invoke(vm_ctx_t *vm, u64 target,\n"
              "                                          u32 call_vm_offset) {",
              count=1,
          )
          replace_exact(
              "internal/runtime/invokegen.go",
              "  if (!vm->reverse || target == 0) {",
              "  if (!vm->reverse || target == 0 || call_vm_offset > vm->bc_len) {",
              count=1,
          )
          replace_exact(
              "internal/runtime/invokegen.go",
              "    int comparison = vm_invoke_key_compare(route, function_file_va, vm->pc);",
              "    int comparison = vm_invoke_key_compare(route, function_file_va,\n"
              "                                                   call_vm_offset);",
              count=1,
          )
          replace_exact(
              "internal/runtime/templates/android/arm64/vm_handlers/h_system.h",
              "  int invoke = vm_try_exception_invoke(vm, address);",
              "  if (!vm->reverse || vm->pc > vm->bc_len ||\n"
              "      instruction_size + 1u > vm->bc_len - vm->pc) {\n"
              "    vm_fault_set(vm, VM_FAULT_CONTROL);\n"
              "    return 0;\n"
              "  }\n"
              "  u32 call_vm_offset = vm->pc + instruction_size + 1u;\n"
              "  int invoke = vm_try_exception_invoke(vm, address, call_vm_offset);",
              count=1,
          )
          PY
          gofmt -w internal/runtime/runtime_test.go internal/runtime/invokegen.go
      - name: Commit repaired exception route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/runtime/runtime_test.go internal/runtime/invokegen.go internal/runtime/templates/android/arm64/vm_handlers/h_system.h
          git commit -m "Use final reverse boundaries for exception invoke routes"
          git push origin HEAD:codex/productization-closure-20260903
