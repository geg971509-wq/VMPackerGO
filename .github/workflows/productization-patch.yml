name: Productization one-shot patch

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/productization-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Align exception route fixtures and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/runtime/runtime_test.go")
          text = path.read_text()
          old = "\t\tFunctionAddress: 0x1000,\n\t\tPlan: &unwind.ExceptionBridgePlan{"
          new = (
              "\t\tFunctionAddress: 0x1000,\n"
              "\t\tRoutes: []ExceptionRouteConfig{{\n"
              "\t\t\tThunkID: 0x1234abcd, FinalVMCallOffset: 64, FinalVMLandingOffset: 32,\n"
              "\t\t}},\n"
              "\t\tPlan: &unwind.ExceptionBridgePlan{"
          )
          if text.count(old) != 1:
              raise SystemExit("runtime_test.go: exception config insertion point changed")
          text = text.replace(old, new, 1)
          old_encoding = "\tcfg.Plan.PersonalityEncoding = unwind.PEAbsptr"
          new_encoding = "\tcfg.Plan.PersonalityEncoding = unwind.PEDatarel | unwind.PESdata4"
          if text.count(old_encoding) != 1:
              raise SystemExit("runtime_test.go: stale personality rejection expectation changed")
          path.write_text(text.replace(old_encoding, new_encoding, 1))
          PY
          cat > internal/runtime/invoke_route_boundary_test.go <<'EOF'
          package runtime

          import (
          	"strings"
          	"testing"
          )

          func TestExceptionInvokeRuntimeUsesFinalReverseInstructionBoundary(t *testing.T) {
          	cfg := testExceptionInvokeConfig()
          	header, _, routes, err := generateExceptionInvokeThunks([]ExceptionInvokeConfig{cfg})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(routes) != 1 {
          		t.Fatalf("routes=%+v", routes)
          	}
          	if routes[0].FinalVMCallOffset != cfg.Routes[0].FinalVMCallOffset ||
          		routes[0].FinalVMLandingOffset != cfg.Routes[0].FinalVMLandingOffset {
          		t.Fatalf("generated final route=%+v want=%+v", routes[0], cfg.Routes[0])
          	}

          	headerText := string(header)
          	for _, token := range []string{
          		"u32 call_vm_offset) {",
          		"call_vm_offset > vm->bc_len",
          		"call_vm_offset);",
          	} {
          		if !strings.Contains(headerText, token) {
          			t.Errorf("generated invoke header lacks %q", token)
          		}
          	}
          	if strings.Contains(headerText, "function_file_va, vm->pc") {
          		t.Fatal("invoke route lookup regressed to the reverse instruction start")
          	}

          	handler, err := templates.ReadFile(templateRoot + "/vm_handlers/h_system.h")
          	if err != nil {
          		t.Fatal(err)
          	}
          	handlerText := string(handler)
          	for _, token := range []string{
          		"instruction_size + 1u > vm->bc_len - vm->pc",
          		"u32 call_vm_offset = vm->pc + instruction_size + 1u;",
          		"vm_try_exception_invoke(vm, address, call_vm_offset)",
          	} {
          		if !strings.Contains(handlerText, token) {
          			t.Errorf("runtime native-call handler lacks %q", token)
          		}
          	}
          }
          EOF
          gofmt -w internal/runtime/runtime_test.go internal/runtime/invoke_route_boundary_test.go
      - name: Commit exception route coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/runtime/runtime_test.go internal/runtime/invoke_route_boundary_test.go
          git commit -m "Lock exception invoke reverse-boundary routing"
          git push origin HEAD:codex/productization-closure-20260903
