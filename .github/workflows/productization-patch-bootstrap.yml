name: Productization patch bootstrap

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/productization-patch-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Restrict the one-shot pre-commit test to new unit coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/productization-patch.yml')
          text = path.read_text()
          old = '          go test -count=1 ./internal/arch/arm64 ./internal/elf\n'
          new = "          go test -count=1 ./internal/arch/arm64\n          go test -count=1 -run 'TestSelectedExternalTailBecomesPackedTail|TestExecutableUnselectedExternalTailBecomesNativeCallReturn|TestUnmappedExternalTailRemainsFailClosed|TestNonTerminalNativeExternalTailRemainsFailClosed' ./internal/elf\n"
          if text.count(old) != 1:
              raise SystemExit('expected broad focused-test command not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/productization-patch.yml
          git commit -m 'Restrict native tail patch preflight tests'
          git push origin HEAD:codex/productization-closure-20260903
