name: Phase 16 Exception Routes Apply

on:
  push:
    branches:
      - fix/exception-final-routes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase16_exception_routes_patch.py
          python3 scripts/phase16_exception_routes_repair.py
          gofmt -w \
            internal/elf/exception_preflight.go \
            internal/elf/preparation.go \
            internal/elf/exception_routes.go \
            internal/elf/exception_routes_test.go \
            internal/elf/exception_preflight_test.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          env -u ANDROID_NDK -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT -u NDK_HOME go test -count=1 ./internal/elf ./internal/unwind
          go vet ./internal/elf ./internal/unwind
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm \
            scripts/phase16_exception_routes_patch.py \
            scripts/phase16_exception_routes_repair.py \
            .github/workflows/phase16-exception-routes-apply.yml \
            .omx/plans/vmp-phase16-exception-final-routes.audit \
            README_NONEXISTENT
          git add internal/elf .omx/plans/vmp-phase16-exception-final-routes.md
          git config user.name "vmpacker-phase16-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Resolve final VM routes for exception bridges"
          git push origin HEAD:fix/exception-final-routes
