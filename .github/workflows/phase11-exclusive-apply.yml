name: Phase 11 Exclusive Apply

on:
  push:
    branches:
      - fix/exclusive-ordering-family

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply audited source patch
        run: |
          set -euo pipefail
          python3 scripts/phase11_exclusive_patch.py
          python3 scripts/phase11_exclusive_test_repair.py
          gofmt -w \
            internal/arch/arm64/decoder.go \
            internal/arch/arm64/decode_ldst.go \
            internal/arch/arm64/policy.go \
            internal/arch/arm64/translator.go \
            internal/arch/arm64/tr_exclusive.go \
            internal/arch/arm64/exclusive_ordering_test.go
      - name: Focused semantic verification
        run: |
          set -euo pipefail
          go test -count=1 ./internal/arch/arm64 ./internal/vm
          go vet ./internal/arch/arm64 ./internal/runtime ./internal/vm
      - name: Commit implementation and remove bootstrap
        run: |
          set -euo pipefail
          git rm scripts/phase11_exclusive_patch.py scripts/phase11_exclusive_test_repair.py .github/workflows/phase11-exclusive-apply.yml
          git add internal/arch/arm64
          git config user.name "vmpacker-phase11-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Support relaxed and mixed exclusive ordering regions"
          git push origin HEAD:fix/exclusive-ordering-family
