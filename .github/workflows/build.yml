name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go checks (macOS ARM64)
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Contract checks
        run: |
          bash -n scripts/*.sh
          bash scripts/check-contract.sh
          bash scripts/check-contract-test.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify host architecture
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - name: Verify exact Android NDK
        shell: bash
        run: |
          set -euo pipefail
          expected="29.0.14206865"
          candidates=(
            "${ANDROID_NDK_ROOT:-}"
            "${ANDROID_NDK_HOME:-}"
            "${NDK_HOME:-}"
          )
          for sdk in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "$HOME/Library/Android/sdk"; do
            [[ -n "$sdk" ]] && candidates+=("$sdk/ndk/$expected")
          done
          candidates+=("/opt/homebrew/share/android-ndk" "/usr/local/share/android-ndk")
          for candidate in /opt/homebrew/Caskroom/android-ndk/*/AndroidNDK*.app/Contents/NDK /usr/local/Caskroom/android-ndk/*/AndroidNDK*.app/Contents/NDK; do
            [[ -d "$candidate" ]] && candidates+=("$candidate")
          done

          ndk=""
          checked=()
          for candidate in "${candidates[@]}"; do
            [[ -n "$candidate" ]] || continue
            checked+=("$candidate")
            [[ -f "$candidate/source.properties" ]] || continue
            revision="$(awk -F= '$1 ~ /^[[:space:]]*Pkg.Revision[[:space:]]*$/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' "$candidate/source.properties")"
            if [[ "$revision" == "$expected" ]]; then
              ndk="$candidate"
              break
            fi
          done

          if [[ -z "$ndk" ]]; then
            printf '::error::Android NDK %s is required but was not found. Install that exact revision on this macOS ARM64 runner or set ANDROID_NDK_ROOT to it. Checked: %s\n' "$expected" "${checked[*]}"
            exit 1
          fi
          printf 'ANDROID_NDK=%s\n' "$ndk" >> "$GITHUB_ENV"
          printf 'Using Android NDK %s at %s\n' "$expected" "$ndk"
      - name: Build current NDK runtime and transitional blob
        run: make android-stub ANDROID_NDK="$ANDROID_NDK"
      - name: Go list
        run: go list ./...
      - name: Go test
        run: go test -count=1 ./...
      - name: Go vet
        run: go vet ./cmd/vmpacker ./internal/...
      - name: Go build
        run: go build ./cmd/vmpacker
