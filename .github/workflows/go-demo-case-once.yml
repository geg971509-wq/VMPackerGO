name: Go demo case one-shot

on:
  push:
    branches:
      - codex/productization-closure-20260903
    paths:
      - .github/workflows/go-demo-case-once.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/productization-closure-20260903
      - name: Resolve Go case through exported C ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('demo/device-cases.json')
          data = json.loads(path.read_text())
          matches = [e for e in data['entries'] if e['id'] == 'demo_go_test']
          if len(matches) != 1:
              raise SystemExit('demo_go_test case identity changed')
          entry = matches[0]
          entry['build_profile'] = 'go-c-shared'
          entry['outcome'] = 'equivalent'
          entry['selectors'] = [{'name':'check_key','abi':'u64(u64)'}]
          entry.pop('reason', None)
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          Path('demo/device-case-summary.txt').write_text('total=85\nresolved=85\nunresolved=0\n')
          PY
      - name: Commit resolved case
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add demo/device-cases.json demo/device-case-summary.txt
          git diff --cached --check
          git commit -m 'Resolve Go demo through explicit C ABI'
          git push origin HEAD:codex/productization-closure-20260903
