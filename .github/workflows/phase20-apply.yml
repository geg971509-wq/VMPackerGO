name: Phase20 CASP pair implementation

on:
  push:
    branches:
      - fix/phase20-casp128
    paths:
      - .github/workflows/phase20-apply.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/phase20-casp128
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Apply CASP pair transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase20_apply.py
          gofmt -w \
            internal/arch/arm64/decoder.go \
            internal/arch/arm64/decode_lse_atomic.go \
            internal/arch/arm64/policy.go \
            internal/arch/arm64/tr_atomic.go \
            internal/arch/arm64/translator.go \
            internal/arch/arm64/compiler_corpus_test.go \
            internal/arch/arm64/casp_atomic_test.go \
            internal/runtime/casp_atomic_test.go
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME
          go test -count=1 ./internal/arch/arm64 ./internal/runtime
          go test -count=1 ./...
          go vet ./...
      - name: Commit product-only implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vmpacker-phase20-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/phase20-apply.yml .github/workflows/phase20-casp-audit.yml scripts/phase20_apply.py
          git add \
            .omx/plans/vmp-phase20-casp128-lse.md \
            internal/arch/arm64/decoder.go \
            internal/arch/arm64/decode_lse_atomic.go \
            internal/arch/arm64/policy.go \
            internal/arch/arm64/tr_atomic.go \
            internal/arch/arm64/translator.go \
            internal/arch/arm64/compiler_corpus_test.go \
            internal/arch/arm64/casp_atomic_test.go \
            internal/runtime/casp_atomic_test.go \
            internal/runtime/templates/android/arm64/vm_handlers/h_system.h \
            internal/runtime/templates/android/arm64/vm_native.h \
            internal/runtime/templates/android/arm64/vm_native.S
          git diff --cached --check
          git commit -m 'Close CASP pair atomics through fixed wire transport'
          git push origin HEAD:fix/phase20-casp128
